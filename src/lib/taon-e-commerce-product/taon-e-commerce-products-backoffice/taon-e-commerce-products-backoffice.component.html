<header class="page-header pb-2">
  <h1>Products</h1>
  <div class="actions">
    <button
      mat-stroked-button
      type="button"
      [disabled]="syncDialogOpen()"
      (click)="syncWithStripe()">
      Sync with Stripe
    </button>
  </div>
</header>

<taon-datatable
  [entityCrudController]="crud"
  [columns]="columns"
  [allowedColumns]="[
    'id',
    'name',
    'type',
    'price',
    'currency',
    'active',
    'stripeLastSyncedAt',
  ]"
  searchMode="advanced"
  (addingItem)="add()">
</taon-datatable>
