<button
  mat-icon-button
  type="button"
  [attr.aria-label]="t.gettext('Open shopping cart')"
  [matBadge]="badgeText"
  [matBadgeHidden]="badgeHidden"
  (click)="openCart()">
  <mat-icon>{{ cartItemCount() ? 'shopping_cart' : 'workspace_premium' }}</mat-icon>
</button>
@if (error()) {
  <span class="cart-button-error" role="alert" [title]="error()">!</span>
}
